<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero B · Midnight Slow-Mo</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
<style>
  :root {
    /* Recommended hero background for variant B (Midnight Slow-Mo). It reproduces exactly what the
       canvas paints (deep espresso, soft peach glow behind the subject, gentle vignette), so there is
       no flash when the canvas comes up. Glow sizes are in vh because the shader scales them with height. */
    --hero-bg:
      radial-gradient(88.2% 75% at 50% 50%, rgba(0, 0, 0, 0.000) 40%, rgba(0, 0, 0, 0.044) 55%, rgba(0, 0, 0, 0.140) 70%, rgba(0, 0, 0, 0.236) 85%, rgba(0, 0, 0, 0.280) 100%),
      radial-gradient(104.5vh 115.5vh at 68% 49%, rgba(249, 174, 127, 0.310) 0.0%, rgba(249, 174, 127, 0.271) 11.4%, rgba(249, 174, 127, 0.184) 22.7%, rgba(249, 174, 127, 0.103) 34.1%, rgba(249, 174, 127, 0.053) 45.5%, rgba(249, 174, 127, 0.015) 68.2%, rgba(249, 174, 127, 0) 100%),
      radial-gradient(circle 110vh at 68% 49%, #2A150B 0%, #25130B 22.5%, #21110A 45%, #1C0F09 72.5%, #160C07 100%);
    --hero-bg-mobile:
      radial-gradient(88.2% 75% at 50% 50%, rgba(0, 0, 0, 0.000) 40%, rgba(0, 0, 0, 0.044) 55%, rgba(0, 0, 0, 0.140) 70%, rgba(0, 0, 0, 0.236) 85%, rgba(0, 0, 0, 0.280) 100%),
      radial-gradient(99vh 77vh at 50% 65.5%, rgba(249, 174, 127, 0.310) 0.0%, rgba(249, 174, 127, 0.271) 11.4%, rgba(249, 174, 127, 0.184) 22.7%, rgba(249, 174, 127, 0.103) 34.1%, rgba(249, 174, 127, 0.053) 45.5%, rgba(249, 174, 127, 0.015) 68.2%, rgba(249, 174, 127, 0) 100%),
      radial-gradient(circle 110vh at 50% 65.5%, #2A150B 0%, #25130B 22.5%, #21110A 45%, #1C0F09 72.5%, #160C07 100%);
    --ink: #FFF1E2;
    --ink-soft: #D9BFA8;
    --accent: #F9AE7F;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: #160C07;
    color: var(--ink);
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
    -webkit-font-smoothing: antialiased;
  }
  #hero { position: relative; height: 260vh; }
  .hero-sticky {
    position: sticky; top: 0; height: 100vh; overflow: hidden;
    background: var(--hero-bg);
  }
  .hero-stage { position: absolute; inset: 0; }
  .hero-stage img.fallback {
    position: absolute; right: 6%; top: 50%; width: min(44vw, 560px); transform: translateY(-50%);
    border-radius: 24px; box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .6);
  }
  .hero-copy {
    position: absolute; z-index: 2; left: clamp(24px, 6vw, 96px); top: 50%;
    transform: translateY(-50%); width: min(40vw, 620px); pointer-events: none;
  }
  .eyebrow {
    font: 600 13px/1.2 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    letter-spacing: .18em; text-transform: uppercase; color: var(--accent); margin: 0 0 18px;
  }
  h1 {
    margin: 0; font-weight: 400; letter-spacing: -0.02em;
    font-size: clamp(2.5rem, 5.6vw, 5.6rem); line-height: .98;
    text-shadow: 0 2px 30px rgba(0, 0, 0, .35);
  }
  h1 em { font-style: italic; color: var(--accent); }
  .scroll-cue {
    margin-top: 28px; font: 500 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink-soft); display: flex; align-items: center; gap: 10px;
  }
  .scroll-cue::before { content: ""; width: 36px; height: 1px; background: currentColor; }
  .after { min-height: 80vh; padding: 12vh 6vw; background: #1B0F09; }
  .after p { max-width: 36em; font-size: 1.15rem; line-height: 1.6; color: var(--ink-soft); }
  .after code { color: var(--accent); }
  @media (max-aspect-ratio: 11/10) {
    .hero-sticky { background: var(--hero-bg-mobile); }
    .hero-copy {
      left: 16px; right: 16px; top: max(7vh, 40px); transform: none; width: auto; text-align: center;
    }
    .eyebrow { margin-bottom: 12px; font-size: 12px; }
    h1 { font-size: clamp(2.2rem, 10.5vw, 3.6rem); }
    .scroll-cue { justify-content: center; margin-top: 16px; }
    .scroll-cue::before { display: none; }
    .hero-stage img.fallback { left: 50%; right: auto; top: auto; bottom: 6vh; width: 82vw; transform: translateX(-50%); }
  }
</style>
</head>
<body>
  <section id="hero" data-hero-track data-hero-required style="height:260vh">
    <div class="hero-sticky">
      <div class="hero-stage" id="hero-stage"></div>
      <div class="hero-copy">
        <p class="eyebrow">Peach's on 47th &middot; Bronzeville</p>
        <h1>Breakfast, stacked high <em>on 47th.</em></h1>
        <p class="scroll-cue">Scroll</p>
      </div>
    </div>
  </section>
  <section class="after">
    <p>Lab page for hero variant B (Midnight Slow-Mo). Scroll back up to scrub the animation. Query params: <code>?p=0..1&amp;t=seconds</code> freezes a frame, <code>?reduced=1</code> renders the final state.</p>
  </section>

<script type="module">
  import { mountHero } from '../assets/js/hero-b.js';

  const q = new URLSearchParams(location.search);
  const track = document.querySelector('[data-hero-track]');
  const stage = document.getElementById('hero-stage');
  const clamp01 = (x) => Math.min(1, Math.max(0, x));

  const getProgress = () => {
    const span = track.offsetHeight - innerHeight;
    return span > 0 ? clamp01((scrollY - track.offsetTop) / span) : 0;
  };

  let frozen = null;
  if (q.has('p')) {
    const p = clamp01(parseFloat(q.get('p')) || 0);
    const t = q.has('t') ? (parseFloat(q.get('t')) || 0) : 2;
    frozen = { p, t };
  }
  const reducedMotion = q.get('reduced') === '1' ||
    (!q.has('p') && !q.has('reduced') && matchMedia('(prefers-reduced-motion: reduce)').matches);

  try {
    window.hero = await mountHero(stage, { getProgress, reducedMotion, frozen });
  } catch (err) {
    const img = document.createElement('img');
    img.className = 'fallback';
    img.alt = 'A tall stack of pancakes with blueberry topping at Peach’s on 47th';
    img.src = '../assets/img/food/berry-pancakes.webp';
    stage.appendChild(img);
    window.__heroReady = true;
    if (err && err.message !== 'webgl-unavailable') console.error(err);
  }
</script>
</body>
</html>
